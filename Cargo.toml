[workspace]
members = [".", "companion", "server", "ttrpg_bridge"]
default-members = ["."]

[package]
name = "osr_ai_gm"
version = "0.1.0"
edition = "2021"

[features]
default = []
dsl-backend = ["dep:ttrpg_interp", "dep:ttrpg_ast", "dep:ttrpg_parser", "dep:ttrpg_checker"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
toml = "0.8"
ttrpg_interp = { git = "https://github.com/tfgast/ttrpg_dsl.git", branch = "main", optional = true }
ttrpg_ast = { git = "https://github.com/tfgast/ttrpg_dsl.git", branch = "main", optional = true }
ttrpg_parser = { git = "https://github.com/tfgast/ttrpg_dsl.git", branch = "main", optional = true }
ttrpg_checker = { git = "https://github.com/tfgast/ttrpg_dsl.git", branch = "main", optional = true }
